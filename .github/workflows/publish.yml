name: Publish GEM

# Releases are cut from the GitHub Releases UI, so the tag is the source of
# truth for the version. This workflow reads the version off the tag, writes it
# into version.rb, commits that bump to main, then publishes to RubyGems.
on:
  release:
    types: [published]

jobs:
  push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    env:
      TAG_NAME: ${{ github.event.release.tag_name }}

    steps:
      # Check out main rather than the tag, because the bump is committed to it.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Derive gem version from the release tag
        run: |
          version="${TAG_NAME#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(\.(.+))?$ ]]; then
            echo "::error::Release tag '${TAG_NAME}' is not a usable gem version. Expected vMAJOR.MINOR.PATCH[.PRE], for example v8.1.0 or v8.1.0.rc1."
            exit 1
          fi
          {
            echo "VERSION=${version}"
            echo "VERSION_MAJOR=${BASH_REMATCH[1]}"
            echo "VERSION_MINOR=${BASH_REMATCH[2]}"
            echo "VERSION_PATCH=${BASH_REMATCH[3]}"
            echo "VERSION_PRE=${BASH_REMATCH[5]:-}"
          } >> "$GITHUB_ENV"

      # The bump has to land on main, so the release must be cut from its head.
      - name: Check the release tag is at the head of main
        run: |
          tag_sha="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
          main_sha="$(git rev-parse HEAD)"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::Tag ${TAG_NAME} is at ${tag_sha} but main is at ${main_sha}. Delete the release and recreate it against the current head of main."
            exit 1
          fi
          echo "TAG_OBJECT=$(git rev-parse "refs/tags/${TAG_NAME}")" >> "$GITHUB_ENV"

      - name: Write the version and refresh Gemfile.lock
        run: |
          pre_literal='nil'
          [ -n "$VERSION_PRE" ] && pre_literal="'${VERSION_PRE}'"

          cat > lib/janus-ar/version.rb <<RUBY
          # frozen_string_literal: true

          module Janus
            unless defined?(::Janus::VERSION)
              module VERSION
                MAJOR = ${VERSION_MAJOR}
                MINOR = ${VERSION_MINOR}
                PATCH = ${VERSION_PATCH}
                PRE = ${pre_literal}

                def self.to_s
                  [MAJOR, MINOR, PATCH, PRE].compact.join('.')
                end
              end
            end
            ::Janus::VERSION
          end
          RUBY

          # Gemfile.lock records the gem's own version in its PATH section, so it
          # has to move with version.rb or the tree is dirty when we publish.
          bundle install --quiet

          built="$(ruby -Ilib -r janus-ar/version -e 'print Janus::VERSION.to_s')"
          if [ "$built" != "$VERSION" ]; then
            echo "::error::Generated version.rb reports ${built}, expected ${VERSION}."
            exit 1
          fi

      - name: Commit the bump to main and move the tag onto it
        run: |
          if git diff --quiet; then
            echo "Already at ${VERSION}; nothing to commit."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/janus-ar/version.rb Gemfile.lock
          git commit -m "Release v${VERSION}"
          git push origin HEAD:main

          # Point the release tag at the commit we actually publish, so checking
          # out the tag gives you the released version. The lease makes this a
          # no-op unless the tag is still exactly where we validated it above.
          git tag -f -a "$TAG_NAME" -m "Version ${VERSION}"
          git push --force-with-lease="refs/tags/${TAG_NAME}:${TAG_OBJECT}" \
            origin "refs/tags/${TAG_NAME}"

      # `rubygems/release-gem` runs `bundle exec rake release`, which refuses to
      # publish from a dirty tree. Everything above is committed by now, so this
      # should always pass; if it does not, fail with something readable rather
      # than "There are files that need to be committed first".
      - name: Check the working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty; refusing to publish."
            git status --porcelain
            git diff
            exit 1
          fi

      # Publishes via trusted publishing (OIDC). `rake release` sees the tag
      # already exists, so it skips creating one and just pushes the gem.
      - uses: rubygems/release-gem@v1
